{% extends "base.html" %}
{% block title %}Company Registration{% endblock %}

{% block nav %}{% endblock %}

{% block content %}
<div class="login-box" style="width: 450px;">
    <h4>Company Registration</h4>
    <p>Create your company account</p>

    <form method="POST" action="/register/company">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" required>

        <label for="company_name">Company Name</label>
        <input id="company_name" type="text" name="company_name" required>

        <label for="email">Email</label>
        <input id="email" type="email" name="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" required>

        <label for="description">Description</label>
        <input id="description" type="text" name="description" placeholder="Brief about your company">

        <input type="submit" value="Register" id="button">
    </form>

    <div class="footer-text">
        Already registered? <a href="{{ url_for('login') }}">Login here</a>
    </div>
</div>
{% endblock %}
